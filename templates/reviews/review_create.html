{% extends "base.html" %}

{% block title %}Write Review - MonExperience{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Write a Review</h1>
        <p class="page-subtitle">Share your experience with others</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                {% load crispy_forms_tags %}
                {% crispy form %}

                <br>
                <div class="alert alert-danger" style="color: var(--muted-foreground);">
                    <small>
                        <i class="bi bi-info-circle"></i>
                        Your review will be visible once approved by a moderator.
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
