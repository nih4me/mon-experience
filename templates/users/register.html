{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Register - MonExperience{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">
            <i class="bi bi-person-plus"></i> Create Account
        </h2>

        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-person-plus"></i> Register
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{% url 'login' %}">Login</a>
            <hr>
            <p class="small text-muted mb-2">Are you a business owner?</p>
            <a href="{% url 'company_register' %}" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-building"></i> Register Your Company
            </a>
        </div>
    </div>
</div>
{% endblock %}
